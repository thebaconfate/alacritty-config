[general]
import = [
    "keybindings.toml"
]

[font]
size = 11.5
normal = { family = "CodeNewRoman Nerd Font Mono", style = "Regular" }
bold = { family = "CodeNewRoman Nerd Font Mono", style = "Bold" }
italic = { family = "CodeNewRoman Nerd Font Mono", style = "Italic" }

[window]
padding = { x = 6, y = 6 }
# Set to "Full" or "None" if you prefer borderless windows
decorations = "Buttonless"
# Start directly into maximized state if desired
startup_mode = "Maximized"


